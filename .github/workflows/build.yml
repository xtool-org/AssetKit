on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        host:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.host.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and test
        run: |
          docker run -v .:/work -w /work -it swift:6.3 swift test
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/configure-xcode
      - name: Build and test
        run: |
          swift test
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/configure-xcode
      - name: Build and test
        run: |
          set -o pipefail \
          && xcodebuild test \
            -skipMacroValidation -skipPackagePluginValidation \
            -scheme AssetKit -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
          | xcbeautify
